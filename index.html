        <style>
            html, body { height: 100%; margin: 0; }
            body {
                display: flex; align-items: center; justify-content: center;
                background: #14161a; color: #e6e8ec;
                font: 16px/1.4 system-ui, sans-serif;
            }
            form { display: flex; flex-direction: column; gap: 10px; width: 260px; }
            input, button {
                font: inherit; padding: 10px 12px; border-radius: 6px;
                border: 1px solid #333842; background: #1c1f26; color: inherit;
            }
            button { background: #2f6feb; border-color: #2f6feb; cursor: pointer; }
            button:disabled { opacity: .6; cursor: default; }
            p { min-height: 1.4em; margin: 0; color: #f07a7a; font-size: 14px; }
        </style>
    </head>

        <form id="gate">
            <input id="pw" type="password" placeholder="Password" autofocus
                   autocomplete="current-password">
            <button id="go" type="submit">Enter</button>

            var ITERATIONS = 250000;

            var bytes = function (s) {
                return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
            };

            async function decrypt(password) {
                var base = await crypto.subtle.importKey(
                    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
                var key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
                    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                var plain = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: bytes(IV) }, key, bytes(CT));
                return new TextDecoder().decode(plain);
            }

            async function unlock(password, remember) {
                var html;
                try { html = await decrypt(password); } catch (e) { return false; }
                if (remember) { try { localStorage.setItem('gate.pw', password); } catch (e) {} }
                document.open();
                document.write(html);
                document.close();
                return true;
            }

            document.getElementById('gate').addEventListener('submit', async function (ev) {
                ev.preventDefault();
                var go = document.getElementById('go');
                var err = document.getElementById('err');
                go.disabled = true;
                err.textContent = '';
                var ok = await unlock(document.getElementById('pw').value, true);
                if (!ok) {
                    err.textContent = 'Wrong password';
                    go.disabled = false;
                }
            });

            (async function () {
                var saved = null;
                try { saved = localStorage.getItem('gate.pw'); } catch (e) {}
                if (saved) { await unlock(saved, false); }
            })();
        </script>
